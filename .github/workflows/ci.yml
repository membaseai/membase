name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      # CPU torch: the engine's sentence-transformers would otherwise pull the CUDA build.
      - run: uv pip install --torch-backend cpu -e '.[local]' --group dev
      - run: .venv/bin/ruff check membase tests
      - run: .venv/bin/pytest
  hermes-plugin:
    # integrations/hermes had no CI at all: `test` above runs `membase tests`, which does not
    # reach it, so its 45 tests had never run anywhere. The drift that shipped 0.3.0 to users
    # while 0.4.0 ran in production went unnoticed for a month partly because of that.
    #
    # The tests install this folder as a user plugin in a temporary HERMES_HOME and drive it
    # through Hermes' own MemoryManager. Every HTTP request is answered by an
    # httpx.MockTransport, so nothing here reaches the network or needs a key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # ⛔ Hermes is pinned to a release, not main. These tests call Hermes internals
      # (`turn_context._memory_turn_start_and_prefetch`), so main can add a parameter and
      # redden this job for a change that is not ours. Raise the pin deliberately, and fix the
      # calls in the same commit. plugin.yaml's `requires_hermes` is the floor, this is the
      # version actually tested against.
      - run: git clone --depth 1 --branch v0.23.3 https://github.com/NousResearch/hermes-agent
             integrations/hermes/.cache/hermes-agent
      # 3.13, not the 3.14 the README names: hermes-agent pins pillow==13.0.0, which has no
      # 3.14 wheel, and membase-core is <3.14 anyway. ruamel.yaml is a Hermes runtime import
      # its own metadata does not declare, so `-e` alone leaves it out.
      - run: uv venv --python 3.13 integrations/hermes/.venv
      - run: uv pip install --python integrations/hermes/.venv/bin/python
             -e integrations/hermes/.cache/hermes-agent
             'membase-ai>=0.4.1,<0.5' 'ruamel.yaml' pytest
      - run: .venv/bin/python -m pytest -q
        working-directory: integrations/hermes
  typescript:
    # npm workspaces: @membaseai/membase (typescript/) and @membaseai/membase-cli (cli/). The CLI
    # resolves the SDK from its build, so the SDK builds first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build -w typescript
      - run: npm run typecheck --workspaces
      - run: npm test --workspaces
      - run: npm run build -w cli
